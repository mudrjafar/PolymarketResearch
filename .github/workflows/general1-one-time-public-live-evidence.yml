name: GENERAL1 One-Time Public RPC Live Evidence
# Attempt 3 after preflight/runtime User-Agent parity regression: 14 audit tests pass.

# Only adding or editing THIS workflow on the isolated audit branch can trigger
# a single public, read-only 300s observation. Other branch pushes do not.
on:
  push:
    branches:
      - audit/general1-live-evidence-gate1-20261028
    paths:
      - .github/workflows/general1-one-time-public-live-evidence.yml

permissions:
  contents: read

jobs:
  public-runtime-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COLLECTOR_INITIAL_LOOKBACK_BLOCKS: "30"
      COLLECTOR_CONFIRMATION_BLOCKS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe public Polygon read-only RPC providers
        run: |
          python - <<'PY'
          import os, json, sys, urllib.request
          endpoints = (
              "https://polygon.drpc.org",
              "https://polygon-bor-rpc.publicnode.com",
              "https://rpc-polygon.blockmachine.io",
              "https://poly.api.pocket.network",
          )
          def call(endpoint, method, params):
              data = json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode()
              req = urllib.request.Request(endpoint, data=data, headers={
                  "Content-Type":"application/json",
                  "User-Agent":"PolymarketResearch-ReadOnly-Evidence/1.0"})
              with urllib.request.urlopen(req, timeout=12) as response:
                  payload = json.load(response)
              if "error" in payload or "result" not in payload:
                  raise ValueError("JSON_RPC_FAILURE")
              return payload["result"]
          for endpoint in endpoints:
              try:
                  chain = int(call(endpoint, "eth_chainId", []), 16)
                  if chain != 137:
                      raise ValueError("NOT_POLYGON")
                  head = int(call(endpoint, "eth_blockNumber", []), 16)
                  assert head > 0
                  logs = call(endpoint, "eth_getLogs", [{
                      "fromBlock": hex(head - 1), "toBlock": hex(head),
                      "address": "0xE111180000d2663C0091e4f400237545B87B996B",
                  }])
                  if not isinstance(logs, list):
                      raise ValueError("INVALID_LOGS")
              except Exception as exc:
                  print("RPC_PROBE_REJECT", endpoint.split("/")[2],
                        type(exc).__name__)
                  continue
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
                  stream.write("POLYMARKET_RPC_URL=" + endpoint + "\n")
              print("RPC_PROBE_PASS", endpoint.split("/")[2])
              break
          else:
              print("RPC_PROBE_NO_WORKING_PUBLIC_PROVIDER")
              sys.exit(2)
          PY
      - name: Prepare disposable, isolated livegate worktree
        run: |
          git worktree add --detach "$RUNNER_TEMP/livegate-github1" "$GITHUB_SHA"
          test ! -e "$RUNNER_TEMP/livegate-github1/data"
      - name: Run 300-second public RPC observation (no Paper, Telegram or orders)
        run: |
          cd "$RUNNER_TEMP/livegate-github1"
          python -u scripts/live_evidence_gate1.py --run-seconds 300 > "$RUNNER_TEMP/general1_livegate_summary.json"
          python -c "import json,os; p=os.path.join(os.environ['RUNNER_TEMP'],'general1_livegate_summary.json'); d=json.load(open(p)); assert d['mode']=='ISOLATED_PUBLIC_READS_NO_PAPER'; assert d['data']['paper_worker_started_by_gate'] is False; print('LIVEGATE_BOUNDED_READ_ONLY_COMPLETE')"
      - name: Print sanitized performance only
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/general1_livegate_summary.json"; then
            python -c "import json,os; d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'general1_livegate_summary.json'))); print(json.dumps({k:d.get(k) for k in ('elapsed_s','unexpected_exits','collector_blocks_per_second','chain_blocks_per_second','lag_first','lag_last','lag_delta','natural_ready','strategy_edge')},sort_keys=True))"
          else
            echo "LIVEGATE_FAILED_BEFORE_SANITIZED_REPORT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general1-livegate-public-sanitized
          path: ${{ runner.temp }}/general1_livegate_summary.json
          if-no-files-found: warn
          retention-days: 7
