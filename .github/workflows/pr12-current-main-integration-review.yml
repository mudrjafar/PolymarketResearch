name: PR12 current-main integration review

on:
  push:
    branches:
      - review/pr12-integration-20261008

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Targeted Paper Settlement
        run: python -m pytest -q tests/test_paper_settlement.py tests/test_paper_engine.py tests/test_paper_worker.py tests/test_telegram_focus_book.py tests/test_learning_ingest.py tests/test_learning_provenance.py
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Machine self-test
        run: python -B run_machine.py --self-test
