name: Paper Settlement CI

on:
  push:
    branches:
      - feat/paper-settlement-v1

jobs:
  test:
    runs-on: windows-latest
    env:
      POLYMARKET_RPC_URL: http://127.0.0.1:1
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted settlement tests
        run: python -m pytest -q tests/test_paper_engine.py tests/test_paper_settlement.py tests/test_paper_worker.py tests/test_telegram_focus_book.py
      - name: Full project tests
        run: python -m pytest -q
      - name: Machine self-test
        run: python -B run_machine.py --self-test
