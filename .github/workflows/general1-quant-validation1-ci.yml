name: GENERAL1 Quant Validation 1 Read-only Audit
on:
  push:
    branches:
      - audit/general1-quant-validation1-20261028
  workflow_dispatch:

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run minimal audit contract tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_quant_validation1.py
      - name: Confirm absent data does not fabricate results
        run: |
          mkdir -p /tmp/general1_quant_empty
          python scripts/quant_validation1.py --data-dir /tmp/general1_quant_empty > /tmp/quant_readiness.json
          python -c "import json; d=json.load(open('/tmp/quant_readiness.json')); assert d['strategy_edge']=='INCONCLUSIVE'; assert d['learning']['status']=='MISSING'; assert d['collector']['status']=='MISSING'"
