name: PR12 settlement hardening validation

on:
  push:
    branches:
      - feat/paper-settlement-v1-current

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Targeted Paper settlement tests
        run: python -m pytest -q tests/test_paper_settlement.py tests/test_paper_engine.py tests/test_paper_worker.py tests/test_telegram_focus_book.py
      - name: Full pytest
        run: python -m pytest tests -q
      - name: Machine self-test
        run: python -B run_machine.py --self-test
