name: Temporary canonical probe gate
on:
  push:
    branches:
      - fix/v2-probe-canonical-evidence-20261012
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POLYMARKET_RPC_URL: http://127.0.0.1:1
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted probe and Collector Flow
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_v2_coverage_probe.py tests/test_collector_sqlite.py tests/test_flow_evidence_interface.py tests/test_flow_unit2.py 2>&1 | tee targeted.log
      - name: Full project tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee full.log
      - name: Handoff evidence
        if: always()
        shell: bash
        run: |
          mkdir -p handoff/scripts handoff/tests
          cp scripts/v2_coverage_probe.py handoff/scripts/
          cp tests/test_v2_coverage_probe.py handoff/tests/
          for file in targeted.log full.log; do if [ -f "$file" ]; then cp "$file" handoff/; fi; done
          git rev-parse HEAD > handoff/CI_COMMIT.txt
          (cd handoff && find . -type f -not -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr CANONICAL_EVIDENCE_HANDOFF.zip handoff
      - name: Attach tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-evidence-handoff
          path: CANONICAL_EVIDENCE_HANDOFF.zip
          retention-days: 14
          if-no-files-found: error
