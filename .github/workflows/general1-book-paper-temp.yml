name: Temporary General1 Book Paper Dashboard gate
on:
  push:
    branches:
      - fix/general1-book-paper-dashboard-gates-20261012
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POLYMARKET_RPC_URL: http://127.0.0.1:1
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted Book Paper Dashboard boundaries
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_book_engine.py tests/test_book_worker.py tests/test_paper_engine.py tests/test_paper_worker.py tests/test_paper_settlement.py tests/test_paper_dashboard.py tests/test_dashboard_streamlit.py tests/test_telegram_focus_book.py 2>&1 | tee targeted.log
      - name: Full project tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee full.log
      - name: Python syntax validation
        shell: bash
        run: |
          python -m py_compile dashboard.py scripts/paper_dashboard.py scripts/book_engine.py scripts/paper_engine.py scripts/paper_worker.py
          git diff --check origin/main...HEAD
      - name: Runtime offline self-test
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python run_machine.py --self-test 2>&1 | tee selftest.log
      - name: Package immutable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p handoff
          for file in targeted.log full.log selftest.log; do
            if test -f "$file"; then cp "$file" handoff/; fi
          done
          git rev-parse HEAD > handoff/CI_COMMIT_SHA.txt
          for file in \
            scripts/book_engine.py scripts/paper_engine.py scripts/paper_worker.py \
            scripts/paper_dashboard.py dashboard.py \
            tests/test_book_engine.py tests/test_book_worker.py tests/test_paper_engine.py \
            tests/test_paper_worker.py tests/test_paper_dashboard.py tests/test_dashboard_streamlit.py \
            scripts/v3_identity.py scripts/paper_settlement.py scripts/flow_tracker.py \
            scripts/live_active_trades.py run_machine.py; do
            mkdir -p "handoff/$(dirname "$file")"
            cp "$file" "handoff/$file"
          done
          (cd handoff && find . -type f -not -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr GENERAL1_OFFLINE_EVIDENCE.zip handoff
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general1-book-paper-dashboard-offline
          path: GENERAL1_OFFLINE_EVIDENCE.zip
          retention-days: 14
          if-no-files-found: error
