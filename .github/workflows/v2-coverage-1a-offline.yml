name: V2 Coverage 1A Offline Tests
on:
  push:
    branches:
      - feat/v2-coverage-1a-evidence-reconciliation
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POLYMARKET_RPC_URL: http://127.0.0.1:1
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted Collector Flow Probe regression
        run: python -m pytest -q tests/test_v2_coverage_probe.py tests/test_collector_sqlite.py tests/test_flow_evidence_interface.py tests/test_flow_unit2.py
      - name: Complete offline project regression
        run: python -m pytest -q
