name: V2 Coverage 1A Offline Tests
on:
  push:
    branches:
      - feat/v2-coverage-1a-evidence-reconciliation
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POLYMARKET_RPC_URL: http://127.0.0.1:1
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted Collector Flow Probe regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_v2_coverage_probe.py tests/test_collector_sqlite.py tests/test_flow_evidence_interface.py tests/test_flow_unit2.py 2>&1 | tee targeted_tests.log
      - name: Complete offline project regression
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee full_tests.log
      - name: Assemble audited handoff files and SHA256 manifest
        if: always()
        shell: bash
        run: |
          mkdir -p handoff/scripts handoff/tests handoff/.github/workflows
          cp scripts/v2_coverage_probe.py handoff/scripts/
          cp tests/test_v2_coverage_probe.py handoff/tests/
          cp .github/workflows/v2-coverage-1a-offline.yml handoff/.github/workflows/
          for file in targeted_tests.log full_tests.log; do
            if [ -f "$file" ]; then cp "$file" handoff/; fi
          done
          git rev-parse HEAD > handoff/BRANCH_COMMIT_SHA.txt
          (cd handoff && find . -type f -not -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr V2_COVERAGE_1A_HANDOFF.zip handoff
      - name: Publish downloadable source + test evidence ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V2_COVERAGE_1A_HANDOFF
          path: V2_COVERAGE_1A_HANDOFF.zip
          retention-days: 30
          if-no-files-found: error
