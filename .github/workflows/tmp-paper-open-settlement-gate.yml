name: Temporary Paper OPEN Settlement Gate Validation

on:
  push:
    branches: [fix/paper-open-settlement-finality-gate]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Paper settlement tests
        run: python -m pytest -q tests/test_paper_worker.py tests/test_paper_settlement.py tests/test_paper_settlement_preflight.py tests/test_paper_engine.py
      - name: Full Project
        run: python -m pytest -q
      - name: Machine Self-Test
        run: python run_machine.py --self-test
