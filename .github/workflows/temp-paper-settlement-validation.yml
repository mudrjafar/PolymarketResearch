name: TEMP Paper Settlement Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  settlement:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Targeted settlement tests
        run: python -m pytest -q tests/test_settlement_resolver.py tests/test_paper_worker.py
      - name: Full project tests
        run: python -m pytest -q
      - name: Machine self-test
        run: python run_machine.py --self-test
