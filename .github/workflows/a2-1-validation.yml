name: A2.1 targeted contract validation

on:
  push:
    branches:
      - fix/signal-contract-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Targeted A2.1 tests
        run: >
          python -m pytest
          tests/test_flow_unit2.py
          tests/test_flow_evidence_interface.py
          tests/test_risk_engine.py
          tests/test_risk_focus_contract.py
          tests/test_risk_generation.py
          -q -ra
      - name: Collector and Storage regressions
        run: >
          python -m pytest
          tests/test_collector_sqlite.py
          collector_storage_v4/test_storage.py
          -q -ra
      - name: Full project regression
        run: python -m pytest tests -q -ra
      - name: Machine self-test
        run: python -B run_machine.py --self-test
