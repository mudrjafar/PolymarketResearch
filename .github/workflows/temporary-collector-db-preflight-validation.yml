name: Temporary Collector DB Preflight Validation

on:
  push:
    branches:
      - feat/collector-db-preflight

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted preflight tests
        run: python -m pytest -q tests/test_collector_db_preflight.py
      - name: Collector storage regressions
        run: python -m pytest -q collector_storage_v4/test_storage.py tests/test_collector_sqlite.py
      - name: Full project regression
        run: python -m pytest -q
      - name: Machine self-test
        run: python run_machine.py --self-test
