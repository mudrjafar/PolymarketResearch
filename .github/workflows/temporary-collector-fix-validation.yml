name: Temporary Collector Fix Validation

on:
  push:
    branches:
      - fix/collector-legacy-schema-migration

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Targeted collector migration tests
        run: python -m pytest -q tests/test_collector_legacy_schema_migration.py collector_storage_v4/test_storage.py tests/test_collector_sqlite.py

      - name: Full project regression
        run: python -m pytest -q

      - name: Machine self-test
        run: python run_machine.py --self-test
