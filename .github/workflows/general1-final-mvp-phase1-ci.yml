name: GENERAL1 Final MVP Phase 1 - Offline Integration Gate
on:
  push:
    branches:
      - feat/general1-final-mvp-phase1-candidate-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q scripts
      - name: Focused integration, security and collector regression
        run: |
          python -m pytest -q tests/test_integration1_gamma_core.py tests/test_general1_ready1.py tests/test_collector_sqlite.py tests/test_flow_unit2.py tests/test_diamond_unit3.py tests/test_focus_engine.py tests/test_focus_runner.py tests/test_risk_engine.py tests/test_risk_focus_contract.py tests/test_book_engine.py tests/test_book_worker.py tests/test_paper_worker.py tests/test_paper_settlement.py
      - name: Full offline test suite
        run: python -m pytest -q
      - name: Machine self-test
        run: python run_machine.py --self-test
