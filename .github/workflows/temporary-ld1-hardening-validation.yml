name: Temporary LD1 Hardening Validation

on:
  push:
    branches:
      - fix/ld1-contract-hardening

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted learning tests
        run: python -m pytest -q tests/test_learning_contract.py tests/test_learning_store.py
      - name: Full project regression
        run: python -m pytest -q
