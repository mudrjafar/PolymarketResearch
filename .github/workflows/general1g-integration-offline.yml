name: GENERAL1-G Combined Offline Safety
on:
  push:
    branches: [test/general1g-combined-safety-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Combined targeted regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_general1g_integration.py tests/test_paper_worker.py tests/test_paper_engine.py tests/test_book_engine.py tests/test_focus_engine.py tests/test_focus_runner.py tests/test_protocol_identity.py tests/test_v2_coverage_probe.py 2>&1 | tee targeted.log
      - name: Full offline project
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee full.log
      - name: Runtime self test
        shell: bash
        run: |
          set -o pipefail
          python run_machine.py --self-test 2>&1 | tee self_test.log
      - name: Evidence bundle
        if: always()
        shell: bash
        run: |
          mkdir -p handoff/source/scripts handoff/source/tests
          git rev-parse HEAD > handoff/commit.txt
          git diff origin/main...HEAD > handoff/changes.diff
          cp scripts/paper_worker.py scripts/protocol_identity.py handoff/source/scripts/
          cp tests/test_general1g_integration.py tests/test_paper_worker.py handoff/source/tests/
          cp -f targeted.log full.log self_test.log handoff/ 2>/dev/null || true
          (cd handoff && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general1g-integrated-offline-handoff
          path: handoff/
          if-no-files-found: error
