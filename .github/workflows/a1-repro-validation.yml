name: A1 reproducible baseline validation

on:
  push:
    branches:
      - fix/reproducible-baseline

permissions:
  contents: read

jobs:
  fresh-clone:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install declared requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify collector storage imports
        run: |
          python -c "from collector_storage_v4.storage import CollectorStore, StorageError; from collector_storage_v4.bridge import CollectorLock, publish_snapshot; print('collector_storage_v4 imports OK')"
      - name: Collector storage offline tests
        run: python -B collector_storage_v4/test_storage.py
      - name: Full pytest regression
        run: python -m pytest tests -q
      - name: Machine self-test
        run: python -B run_machine.py --self-test
