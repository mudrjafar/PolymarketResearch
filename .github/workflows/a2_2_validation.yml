name: A2.2 validation
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/risk_engine.py --self-test
      - run: python run_machine.py --self-test
