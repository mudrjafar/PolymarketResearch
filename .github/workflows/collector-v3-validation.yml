name: COLLECTOR-V3-1 temporary validation

on:
  push:
    branches:
      - feat/collector-v3-runtime-coverage

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POLYMARKET_RPC_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collector direct self-test path
        run: python -B tests/test_collector_sqlite.py
      - name: Collector V3 and downstream evidence regressions
        run: >-
          python -m pytest -q
          tests/test_collector_sqlite.py
          tests/test_v2_coverage_probe.py
          tests/test_flow_evidence_interface.py
          tests/test_flow_unit2.py
          tests/test_regressions.py
      - name: Full pytest
        run: python -m pytest -q
      - name: Machine self-test
        run: python -B run_machine.py --self-test
