name: RUNTIME-2 temporary validation

on:
  push:
    branches:
      - feat/runtime-supervisor-current-main

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POLYMARKET_RPC_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Targeted supervisor tests
        run: python -m pytest -q tests/test_runtime_supervisor.py

      - name: Relevant runtime and integration tests
        run: >-
          python -m pytest -q
          tests/test_machine_v3.py
          tests/test_regressions.py
          tests/test_collector_sqlite.py
          tests/test_learning_provenance.py
          tests/test_v2_coverage_probe.py

      - name: Full pytest
        run: python -m pytest -q

      - name: Machine self-test
        run: python -B run_machine.py --self-test
