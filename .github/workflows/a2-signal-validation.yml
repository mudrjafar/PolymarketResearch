name: A2 signal contract validation

on:
  push:
    branches:
      - fix/signal-contract-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Targeted A2 tests
        run: >
          python -m pytest
          tests/test_flow_unit2.py
          tests/test_flow_evidence_interface.py
          tests/test_risk_engine.py
          tests/test_risk_focus_contract.py
          tests/test_risk_generation.py
          -q
      - name: Full pytest
        run: python -m pytest tests -q
      - name: Machine self-test
        run: python -B run_machine.py --self-test
